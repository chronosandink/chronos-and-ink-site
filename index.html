<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos & Ink Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --surface: #ffffff;
    --surface-soft: #f8f9fa;
    --ink: #122347;
    --muted: #647393;
    --line: #e1d8ca;
    --rose: #b54a4e;
    --emerald: #16a34a;
    --purple: #7c3aed;
    --orange: #ea580c;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }

  .page { max-width: 1200px; margin: 0 auto; padding: 0 40px; position: relative; }
  
  .topbar {
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    gap: 24px;
    position: relative;
    z-index: 100;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
  }
  .brand-logo-img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    flex-shrink: 0;
    transition: transform 0.3s ease;
  }
  .brand:hover .brand-logo-img {
    transform: rotate(-5deg) scale(1.05);
  }
  .brand-name {
    display: block;
    font-family: Fraunces, serif;
    font-size: 26px;
    line-height: 1;
    font-weight: 500;
  }
  .brand-line {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav button {
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    padding: 10px 18px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    transition: all .25s ease;
  }
  .nav button:hover,
  .nav button.active {
    background: var(--ink);
    color: var(--surface);
  }

  .menu-toggle {
    display: none;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 8px;
    z-index: 110;
  }
  .menu-toggle svg {
    width: 28px;
    height: 28px;
    fill: var(--ink);
  }

  /* REFRESH VIEW ROUTE ANIMATION */
  main { padding: 64px 0 100px; }
  
  .view-animate {
    animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .hero {
    margin-bottom: 80px;
    padding: 40px 0;
  }
  h1, h2, h3 { margin: 0; font-weight: 400; }
  h1 {
    font-family: Fraunces, serif;
    font-size: clamp(42px, 6.5vw, 76px);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .lead {
    max-width: 680px;
    margin: 24px 0 0;
    color: var(--muted);
    font-size: 19px;
    line-height: 1.7;
  }
  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 36px;
  }
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    padding: 0 24px;
    background: var(--ink);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .button.secondary {
    background: transparent;
    color: var(--ink);
    border-color: var(--ink);
  }
  .button:hover { 
    transform: translateY(-2px); 
    box-shadow: 0 8px 20px rgba(18, 35, 71, 0.12);
  }

  .section-head {
    border-bottom: 1px solid var(--line);
    padding-bottom: 24px;
    margin-bottom: 48px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 40px;
  }
  .section-head h2 {
    font-family: Fraunces, serif;
    font-size: clamp(32px, 4.5vw, 48px);
    letter-spacing: -0.01em;
  }
  .section-head p {
    margin: 10px 0 0;
    max-width: 600px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
  }
  .count {
    white-space: nowrap;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  /* PREMIUM EDITORIAL SPREAD LAYOUT FOR SHELVES */
  .collection-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 36px;
    margin-bottom: 84px;
  }
  .editorial-spread {
    display: flex;
    flex-direction: column;
    text-align: left;
    position: relative;
    padding-top: 20px;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .spread-num {
    font-family: Fraunces, serif;
    font-size: 54px;
    line-height: 1;
    color: var(--ink);
    opacity: 0.15;
    margin-bottom: 12px;
    font-weight: 500;
    transition: opacity 0.3s ease, transform 0.3s ease;
    transform-origin: left bottom;
  }
  .spread-title-wrap {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }
  .spread-accent {
    width: 4px;
    height: 28px;
    border-radius: 2px;
    flex-shrink: 0;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .editorial-spread h3 {
    font-family: Fraunces, serif;
    font-size: 26px;
    line-height: 1.1;
    color: var(--ink);
  }
  .editorial-spread p {
    margin: 16px 0 24px;
    color: var(--muted);
    line-height: 1.65;
    font-size: 14px;
    flex-grow: 1;
  }
  .editorial-link {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 4px;
    align-self: flex-start;
    transition: gap 0.2s ease;
  }
  
  /* EDITORIAL HOVER ANIMATION EFFECT */
  .editorial-spread:hover {
    transform: translateY(-4px);
  }
  .editorial-spread:hover .spread-num {
    opacity: 0.28;
    transform: scale(1.05);
  }
  .editorial-spread:hover .spread-accent {
    transform: scaleY(1.25);
  }
  .editorial-spread:hover .editorial-link {
    gap: 10px;
  }

  .shelf-layout {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    gap: 48px;
  }
  .filter-panel {
    position: sticky;
    top: 40px;
    align-self: start;
  }
  .filter-panel h2 {
    font-family: Fraunces, serif;
    font-size: 28px;
    margin-bottom: 20px;
  }
  .filter-panel button {
    width: 100%;
    margin-top: 6px;
    border: none;
    background: transparent;
    padding: 10px 0;
    text-align: left;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    border-bottom: 1px solid transparent;
    transition: all 0.2s ease;
  }
  .filter-panel button.active,
  .filter-panel button:hover {
    color: var(--ink);
    border-bottom-color: var(--ink);
    padding-left: 6px;
  }
  
  .books-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }
  .book-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 32px;
    align-items: center;
    border-bottom: 1px solid var(--line);
    padding-bottom: 28px;
    transition: transform 0.2s ease;
  }
  .book-row:hover {
    transform: translateX(4px);
  }
  .book-indicator {
    width: 8px;
    height: 48px;
    border-radius: 4px;
  }
  .book-main { min-width: 0; }
  .book-row h3 {
    margin: 6px 0 8px;
    font-family: Fraunces, serif;
    font-size: 24px;
    line-height: 1.2;
  }
  .book-row .meta {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .book-row p {
    max-width: 660px;
    margin: 0;
    color: var(--muted);
    line-height: 1.6;
    font-size: 15px;
  }
  .buy {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    min-height: 44px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    padding: 0 24px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .buy:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(18, 35, 71, 0.15);
  }

  /* HIGH CONVERSION FEATURED SHOWCASE GRID WITH MICRO-ANIMATIONS */
  .featured-showcase-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 32px;
  }
  .showcase-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface-soft);
    position: relative;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .showcase-card:hover {
    transform: translateY(-6px);
    border-color: var(--ink);
    box-shadow: 0 12px 24px rgba(18, 35, 71, 0.06);
  }
  .showcase-badge {
    position: absolute;
    top: -12px;
    left: 20px;
    background: #ffffff;
    border: 1px solid var(--line);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .showcase-card h3 {
    font-family: Fraunces, serif;
    font-size: 22px;
    line-height: 1.2;
    margin: 8px 0 12px;
    color: var(--ink);
  }
  .showcase-card p {
    margin: 0 0 24px 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    flex-grow: 1;
  }
  .showcase-card .buy {
    width: 100%;
  }

  .detail-hero {
    border-bottom: 1px solid var(--line);
    padding-bottom: 40px;
    margin-bottom: 48px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 24px;
    align-items: end;
  }
  .back {
    display: inline-flex;
    margin-bottom: 32px;
    color: var(--muted);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .back:hover { color: var(--ink); transform: translateX(-3px); }

  footer {
    border-top: 1px solid var(--line);
    padding: 40px 0;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    margin-top: 60px;
  }

  @media (max-width: 1024px) {
    .collection-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px; }
    .featured-showcase-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  }
  
  @media (max-width: 840px) {
    .page { padding: 0 24px; }
    .menu-toggle { display: block; }
    
    .nav {
      position: fixed;
      top: 0;
      right: -100%;
      width: 280px;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--line);
      box-shadow: -10px 0 30px rgba(0,0,0,0.05);
      flex-direction: column;
      align-items: flex-start;
      padding: 120px 24px 40px;
      gap: 12px;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 95;
    }
    .nav.open {
      right: 0;
    }
    .nav button {
      width: 100%;
      text-align: left;
      border-radius: 8px;
      padding: 14px 20px;
      font-size: 16px;
    }
    
    .collection-grid { grid-template-columns: 1fr; gap: 40px; }
    .featured-showcase-grid { grid-template-columns: 1fr; gap: 24px; }
    .shelf-layout { grid-template-columns: 1fr; gap: 32px; }
    .filter-panel { position: static; }
    .book-row { grid-template-columns: 1fr; gap: 16px; padding-bottom: 36px; }
    .book-indicator { display: none; }
    .buy { justify-self: start; width: 100%; }
    .detail-hero { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand" onclick="navigate('home')" role="button" tabindex="0" aria-label="Go home">
      <img class="brand-logo-img" src="logo.png" alt="Chronos & Ink Logo">
      <div>
        <span class="brand-name">Chronos & Ink</span>
        <span class="brand-line">write · preserve · inspire</span>
      </div>
    </div>
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle navigation menu">
      <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <nav class="nav" id="mainNav" aria-label="Primary">
      <button data-nav="home" onclick="handleNav('home')">Home</button>
      <button data-nav="shelf" onclick="handleNav('shelf')">Shelf</button>
      <button data-nav="romance" onclick="handleNav('romance')">Romance</button>
      <button data-nav="levelup" onclick="handleNav('levelup')">Productivity</button>
      <button data-nav="diaries" onclick="handleNav('diaries')">Diaries</button>
      <button data-nav="journals" onclick="handleNav('journals')">Journals</button>
    </nav>
  </header>

  <main id="view" class="view-animate"></main>

  <footer>&copy; Chronos & Ink. Beautifully bound reading editions and structured archives.</footer>
</div>

<script>
const DATA = {

    ]
  },

      { title: "Mother's Day Diary", link: "https://kdpbook.link/for/B0H6SM91XC", subtitle: "Edition", blurb: "A Notebook for Memories, Milestones, and Family Legacy | Blank Lined Keepsake Journal for Moms" },

  },
  journals: {
    label: "Journals Collection",
    eyebrow: "Structured Workspaces",
    title: "Journals",
    intro: "Mindful prompt templates and tactical focus tools designed for modern habits.",
    colorA: "#f97316",
    colorB: "#ea580c",
    books: [
      { title: "The 5-Minute Morning Journal", link: "https://kdpbook.link/for/B0GKY8Z4TB", subtitle: "Edition", blurb: "Gratitude - Daily Intention - Daily Affirmation" },
      { title: "The 5-Minute Before Bed Journal", link: "https://kdpbook.link/for/B0GX9BSJWZ", subtitle: "Edition", blurb: "Gratitude - Reflection - Peace" }
    ]
  }
};

const view = document.getElementById("view");
const nav = document.getElementById("mainNav");

function toggleMenu() {
  nav.classList.toggle("open");
}

function handleNav(route) {
  nav.classList.remove("open");
  navigate(route);
}

function navigate(route) {
  location.hash = "#/" + (route === "shelf" ? "shelf" : route === "home" ? "" : route);
}

function setActive(route) {
  document.querySelectorAll("[data-nav]").forEach(button => {
    button.classList.toggle("active", button.dataset.nav === route || (route === "home" && button.dataset.nav === "home"));
  });
}

function triggerViewRefresh() {
  view.classList.remove("view-animate");
  void view.offsetWidth; 
  view.classList.add("view-animate");
}

function bookRow(book, collection) {
  const blurb = book.blurb || "A clean structured workspace for plans, milestones, and personal focus.";
  const label = book.vol || book.subtitle || collection.label;
  return `
    <article class="book-row">
      <div class="book-indicator" style="background: linear-gradient(180deg, ${collection.colorA}, ${collection.colorB})" aria-hidden="true"></div>
      <div class="book-main">
        <div class="meta">${label} &ensp;·&ensp; ${collection.label}</div>
        <h3>${book.title}</h3>
        <p>${blurb}</p>
      </div>
      <a class="buy" href="${book.link}" target="_blank" rel="noopener">Purchase Edition</a>
    </article>
  `;
}

function showcaseCard(item) {
  return `
    <article class="showcase-card">
      <span class="showcase-badge" style="color: ${item.collection.colorA}">${item.collection.title}</span>
      <div>
        <h3>${item.book.title}</h3>
        <p>${item.book.blurb || 'Curated structural workspace.'}</p>
      </div>
      <a class="buy" href="${item.book.link}" target="_blank" rel="noopener">Purchase Now</a>
    </article>
  `;
}

function editorialSpreadCard(num, key, collection) {
  return `
    <article class="editorial-spread" onclick="navigate('${key}')" role="button" tabindex="0">
      <div class="spread-num" style="color: var(--ink); opacity: 0.15;">${num}</div>
      <div class="spread-title-wrap">
        <div class="spread-accent" style="background: linear-gradient(to bottom, ${collection.colorA}, ${collection.colorB})"></div>
        <h3>${collection.title}</h3>
      </div>
      <p>${collection.intro}</p>
      <span class="editorial-link">Explore Shelf Collection →</span>
    </article>
  `;
}

function getFeaturedBooks() {
  const targets = [
    { title: "When We First Collided", key: "romance" },
    { title: "How to Drive Manifestation", key: "levelup" },
    { title: "The 5-Minute Morning Journal", key: "journals" },
    { title: "Best Sister Diary", key: "diaries" }
  ];
  
  return targets.map(t => {
    const bookMatch = DATA[t.key].books.find(b => b.title.toLowerCase() === t.title.toLowerCase());
    return bookMatch ? { book: bookMatch, collection: DATA[t.key] } : null;
  }).filter(item => item !== null);
}

function renderHome() {
  setActive("home");
  view.innerHTML = `
    <section class="hero">
      <div>
        <h1>Stories to read.<br>Pages to keep.</h1>
        <p class="lead">Explore the Chronos & Ink shelf: emotional romance novels, tactical productivity manuals, and structured spaces for daily reflection.</p>
        <div class="hero-actions">
          <button class="button" onclick="navigate('shelf')">View Entire Shelf</button>
          <button class="button secondary" onclick="navigate('romance')">Start Reading Romance</button>
        </div>
      </div>
    </section>

    <section style="margin-bottom: 84px;">
      <div class="section-head">
        <div>
          <h2>Featured Books</h2>
          <p>A curated showcase of featured literary volumes and workspaces available immediately.</p>
        </div>
      </div>
      <div class="featured-showcase-grid">
        ${getFeaturedBooks().map(item => showcaseCard(item)).join("")}
      </div>
    </section>

    <section>
      <div class="section-head">
        <div>
          <h2>Curated Shelves</h2>
          <p>Select a dedicated shelf below to browse dynamic title structures, specific volumes, and physical publishing specs.</p>
        </div>
      </div>
      <div class="collection-grid">
        ${editorialSpreadCard("01", "romance", DATA.romance)}
        ${editorialSpreadCard("02", "levelup", DATA.levelup)}
        ${editorialSpreadCard("03", "diaries", DATA.diaries)}
        ${editorialSpreadCard("04", "journals", DATA.journals)}
      </div>
    </section>
  `;
}

function allBooks() {
  return [
    ...DATA.romance.books.map(book => ({ book, collection: DATA.romance })),
    ...DATA.levelup.books.map(book => ({ book, collection: DATA.levelup })),
    ...DATA.diaries.books.map(book => ({ book, collection: DATA.diaries })),
    ...DATA.journals.books.map(book => ({ book, collection: DATA.journals }))
  ];
}

function shelfSection(title, intro, items = allBooks()) {
  return `
    <section>
      <div class="section-head">
        <div>
          <h2>${title}</h2>
          <p>${intro}</p>
        </div>
        <div class="count">${items.length} titles</div>
      </div>
      <div class="books-grid">
        ${items.map(item => bookRow(item.book, item.collection)).join("")}
      </div>
    </section>
  `;
}

function renderShelf(filter = "all") {
  setActive("shelf");
  const items = filter === "romance"
    ? DATA.romance.books.map(book => ({ book, collection: DATA.romance }))
    : filter === "levelup"
      ? DATA.levelup.books.map(book => ({ book, collection: DATA.levelup }))
      : filter === "diaries"
        ? DATA.diaries.books.map(book => ({ book, collection: DATA.diaries }))
        : filter === "journals"
          ? DATA.journals.books.map(book => ({ book, collection: DATA.journals }))
          : allBooks();

  view.innerHTML = `
    <section class="shelf-layout">
      <aside class="filter-panel">
        <h2>Shelf</h2>
        <button class="${filter === "all" ? "active" : ""}" onclick="renderShelf('all')">All Books</button>
        <button class="${filter === "romance" ? "active" : ""}" onclick="renderShelf('romance')">Romance Trilogy - When We</button>
        <button class="${filter === "levelup" ? "active" : ""}" onclick="renderShelf('levelup')">Level Up Series</button>
        <button class="${filter === "diaries" ? "active" : ""}" onclick="renderShelf('diaries')">Diaries</button>
        <button class="${filter === "journals" ? "active" : ""}" onclick="renderShelf('journals')">Journals</button>
      </aside>
      <div>
        ${shelfSection(filter === "all" ? "Master Index" : DATA[filter].title, "Browse individual publications, specs, and online distribution channels.", items)}
      </div>
    </section>
  `;
}

function renderCollection(key) {
  const collection = DATA[key];
  setActive(key);
  const items = collection.books.map(book => ({ book, collection }));
  view.innerHTML = `
    <div class="back" onclick="navigate('home')" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" style="fill: #ffffff; width: 14px; height: 14px; vertical-align: middle; margin-right: 4px;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>← Return to Main Library</div>
    <section class="detail-hero">
      <div>
        <h1>${collection.title}</h1>
        <p class="lead">${collection.intro}</p>
      </div>
      <div class="count">${collection.books.length} items</div>
    </section>
    ${shelfSection(collection.label, "Select a title below to view availability, structural descriptions, and ordering platforms.", items)}
  `;
}

function router() {
  triggerViewRefresh();
  const route = location.hash.replace("#/", "") || "home";
  if (route === "shelf") renderShelf();
  else if (route === "romance" || route === "levelup" || route === "diaries" || route === "journals") renderCollection(route);
  else renderHome();
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", router);
router();
</script>
</body>
</html>
